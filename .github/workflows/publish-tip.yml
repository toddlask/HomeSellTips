name: Publish next tip

on:
  schedule:
    # Daily at 14:00 UTC. The script publishes only when the newest published tip is at least 2 days old.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tip
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Publish or open a review item
        run: npm run content:publish
        env:
          REVIEW_REQUIRED: ${{ vars.REVIEW_REQUIRED }}
      - name: Draft renewal notes into the outbox
        run: npm run outbox:draft
      - name: Commit content updates
        run: |
          if git diff --quiet -- content; then
            echo "No content change."
            exit 0
          fi
          git config user.name "HomeSellTips publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Update the tip queue and renewal drafts"
          git push
